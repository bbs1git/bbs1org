services:
  php-init:
    image: ghcr.io/bbs1org/bbs1org:6.10
    user: "0:0"
    command: sh -ec 'if [ ! -f index.php ]; then cp -a /usr/local/share/bbs1org-template/. .; fi; if [ ! -f app/data/install.lock ] && [ -n "$${BBS_ADMIN_PASSWORD:-}" ]; then php index.php auto-install; fi; chown -R www-data:www-data app && chown root:www-data . && chmod 775 .'
    environment:
      BBS_DB_DRIVER: ${COMPOSE_PROFILES:-sqlite}
      BBS_DB_HOST: ${DB_HOST:-}
      BBS_DB_PORT: ${DB_PORT:-}
      BBS_DB_NAME: ${DB_NAME:-forum}
      BBS_DB_USER: ${DB_USER:-forum}
      BBS_DB_PASSWORD: ${DB_PASSWORD:-change-this-password}
      BBS_ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      BBS_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BBS_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      BBS_SITE_NAME: ${SITE_NAME:-我的论坛}
      BBS_FORUM_NAME: ${FORUM_NAME:-默认版块}
    volumes:
      - code:/var/www/html
      - data:/var/www/html/app/data
      - avatars:/var/www/html/app/avatars
      - upload:/var/www/html/app/upload
      - plugins:/var/www/html/app/plugins

  php:
    image: ghcr.io/bbs1org/bbs1org:6.10
    restart: unless-stopped
    depends_on:
      php-init:
        condition: service_completed_successfully
    volumes:
      - code:/var/www/html
      - data:/var/www/html/app/data
      - avatars:/var/www/html/app/avatars
      - upload:/var/www/html/app/upload
      - plugins:/var/www/html/app/plugins

  cron:
    image: ghcr.io/bbs1org/bbs1org:6.10
    restart: unless-stopped
    depends_on:
      php-init:
        condition: service_completed_successfully
    command: ["sh", "/usr/local/bin/bbs1-cron"]
    volumes:
      - code:/var/www/html
      - data:/var/www/html/app/data
      - avatars:/var/www/html/app/avatars
      - upload:/var/www/html/app/upload
      - plugins:/var/www/html/app/plugins

  nginx:
    image: ghcr.io/bbs1org/bbs1org-nginx:6.10
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - code:/var/www/html:ro
      - avatars:/var/www/html/app/avatars:ro
      - upload:/var/www/html/app/upload:ro

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    command: --ngram-token-size=2
    environment:
      MYSQL_DATABASE: ${DB_NAME:-forum}
      MYSQL_USER: ${DB_USER:-forum}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-this-password}
    volumes:
      - mysql:/var/lib/mysql

  postgres:
    image: postgres:18
    profiles: ["pgsql"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-forum}
      POSTGRES_USER: ${DB_USER:-forum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  code:
  data:
  avatars:
  upload:
  plugins:
  mysql:
  postgres:
